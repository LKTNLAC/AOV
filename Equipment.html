<!--Bùi Hoàng Long-->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Trang Bị Liên Quân</title>
    <link rel="icon" type="image/png" href="Media/logoweb.png">
    <link rel="stylesheet" href="css/equipment.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>Danh Sách Trang Bị Liên Quân</header>
    <!--Thanh bar-->
    <nav>
        <a href="Home.html">Trang chủ</a>
        <a href="#">Giới thiệu</a>
        <a href="index.html">Tướng</a>
        <a href="Equipment.html">Trang Bị</a>
        <a href="#">Liên hệ</a>
    </nav>
    <!--Thanh bar vị tri tướng-->
    <div class="role-filter">
        <button onclick="filterByRole('Tất cả')">Tất cả</button>
        <button onclick="filterByRole('Công Vật Lý')">Vật Lý</button>
        <button onclick="filterByRole('Đi Rừng')">Rừng</button>
        <button onclick="filterByRole('Công Phép')">Phép</button>
        <button onclick="filterByRole('Thủ')">Thủ</button>
        <button onclick="filterByRole('Tốc Chạy')">Tốc Chạy</button>
        <button onclick="filterByRole('Phụ Trợ')">Phụ Trợ</button>
    </div>

    <div class="equip-grid" id="equipGrid"></div>
<!--Popup hiển thị thông tin tướng-->
    <div class="popup" id="popup" style="display: none;">
        <div class="popup-content">
            <h2 id="equipName"></h2>
            <p><strong>Vai trò:</strong> <span id="equipRole"></span></p>
            <!--Tướng counter-->
            <p><strong>Giá Vàng: </strong></p>
            <div id="equipPrice" style="display: flex; gap: 10px; margin-top: 10px;"></div>
            <!--<ul id="heroCounter"></ul>-->
            <!--Tướng hỗ trợ-->
            <p><strong>Trang Bị Sơ Cấp:</strong></p>
            <div id="equipPrimaryImages" style="display: flex; gap: 10px; margin-top: 10px;"></div>
            <!--<ul id="heroSuitable"></ul>-->
            <!--Trang bị-->

            <!--Ghi chú-->
            <p><strong>Ghi chú:</strong></p>
            <p id="equipNote" style="white-space: pre-wrap; font-style: italic;"></p>
            <!--Đóng-->
            <button onclick="closePopup()">Đóng</button>
        </div>
    </div>

    <script src="js/Trangbi.js"></script>
</body>
</html>
